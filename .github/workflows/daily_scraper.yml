name: Daily Gold & Silver Rates Scraper

on:
  schedule:
    # 04:45 UTC corresponds to 10:30 AM Nepal Time (NPT, UTC+5:45)
    - cron: '45 4 * * *'
    # 10:30 UTC corresponds to 10:30 AM UTC
    - cron: '30 10 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --staged --quiet; then
            echo "No changes to commit (rates are already up to date)."
          else
            git commit -m "chore(rates): update gold and silver rates [skip ci]"
            git push
          fi
